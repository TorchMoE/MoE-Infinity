name: Create Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-22.04
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Extract branch info
        shell: bash
        run: |
          echo "release_tag=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: actions/github-script@v6
        env:
          RELEASE_TAG: ${{ env.release_tag }}
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          script: |
            const script = require('.github/workflows/scripts/create-release.js')
            await script(github, context, core)

  wheel:
    name: Build Wheel
    runs-on: ubuntu-22.04
    needs: release
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        cuda-version: ['12.8']

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Free Disk Space
        run: |
          rm -rf /usr/local/cuda-* /opt/cuda
          rm -rf /usr/local/cuda
          bash -x .github/workflows/scripts/free-disk-space.sh

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CUDA ${{ matrix.cuda-version }}
        run: |
          bash -x .github/workflows/scripts/cuda-install.sh ${{ matrix.cuda-version }} ubuntu-22.04

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git uuid-dev

      - name: Install Python build dependencies (torch matched to CUDA)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "setuptools>=78.1.1,<82" "setuptools-scm>=8" wheel ninja py-cpuinfo build
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cu128

      - name: Fetch CUTLASS headers
        run: |
          git clone --depth 1 --branch v3.9.2 https://github.com/NVIDIA/cutlass.git "${HOME}/cutlass"

      - name: Build Wheel
        shell: bash
        env:
          NVTX_DISABLE: "1"
        run: |
          export CUDA_HOME="/usr/local/cuda-${{ matrix.cuda-version }}"
          export PATH="${CUDA_HOME}/bin:${PATH}"
          export CUTLASS_DIR="${HOME}/cutlass"
          python3 -m build --wheel --no-isolation
          wheel_name=$(ls dist/*whl | xargs -n 1 basename)
          asset_name=${wheel_name//"linux"/"manylinux1"}
          echo "wheel_name=${wheel_name}" >> $GITHUB_ENV
          echo "asset_name=${asset_name}" >> $GITHUB_ENV

      - name: Build Source
        if: ${{ matrix.python-version == '3.10' }}
        run: |
          python3 -m build --sdist

      - name: Rename Wheel
        run: |
          mv dist/${{ env.wheel_name }} dist/${{ env.asset_name }}

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: ./dist/${{ env.asset_name }}
          asset_name: ${{ env.asset_name }}
          asset_content_type: application/*

      - name: Stage sdist for PyPI
        if: ${{ matrix.python-version == '3.10' }}
        run: |
          mkdir -p sdist_only
          cp dist/*.tar.gz sdist_only/

      # Only the sdist is published to PyPI. Prebuilt CUDA wheels are ABI-locked to a
      # specific torch/CUDA, which PyPI wheel tags cannot express; they are attached to
      # the GitHub Release instead. pip installs the sdist and compiles it locally.
      # Auth via PyPI Trusted Publishing (OIDC) — no username/password needed;
      # requires id-token: write (above) and a publisher registered on PyPI for
      # this repo + workflow file. See RELEASE.md.
      - name: Publish sdist to PyPI
        if: ${{ matrix.python-version == '3.10' }}
        uses: pypa/gh-action-pypi-publish@release/v1.8
        with:
          skip-existing: true
          packages-dir: sdist_only
